# Preview Pal / CineMemory on one machine: API + web behind Caddy (automatic HTTPS).
# Usage (from the repo root, on the server):
#   cp .env.example .env   # fill GEMINI_API_KEY, CLICKHOUSE_*, PUBLIC_URL
#   docker compose -f deploy/compose.yml up -d --build
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file: ../.env
    environment:
      API_PORT: "8080"
      CINEMEMORY_DATA_DIR: /data
      MEDIA_PROVIDER: gemini
    volumes:
      - data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        # The browser calls the API on the same public origin; Caddy routes /api and /media to the API container.
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL}
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - web
      - api

volumes:
  data:
  caddy_data:
  caddy_config:
